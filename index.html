<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ticket Tracker</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ticket Tracker">
<meta name="theme-color" content="#0e1117">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#0e1117;--card:#171b24;--line:#262c38;--txt:#e6e9ef;--dim:#8b93a5;--g:#22c55e;--r:#ef4444;--y:#eab308;--b:#3b82f6}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",Segoe UI,Roboto,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 30px)}
h1{font-size:24px;margin:4px 0 12px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.box .k{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}.box .v{font-size:22px;font-weight:700;margin-top:2px}
.upd{display:flex;justify-content:space-between;align-items:center;color:var(--dim);font-size:13px;margin:8px 2px 14px}
button{background:#232a37;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.card.Cashed{border-color:var(--g)}.pill.Void{background:#2a3140;color:#8b93a5}.card.Lost{border-color:var(--r);opacity:.75}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.tn{font-size:19px;font-weight:700}.ts{color:var(--dim);font-size:14px;margin-top:2px}
.pill{font-size:13px;font-weight:700;padding:5px 10px;border-radius:999px;white-space:nowrap}
.pill.Pregame{background:#2a3140;color:#c3c9d6}.pill.Live{background:#3b2f0b;color:var(--y)}.pill.Cashed{background:#0f3a20;color:var(--g)}.pill.Lost{background:#3d1414;color:var(--r)}
.prob{margin:10px 0 4px;font-size:14px;color:var(--dim)}.prob b{color:var(--txt);font-size:17px}
.leg{border-top:1px solid var(--line);padding:11px 0 9px}
.lr{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.lp{font-weight:600;font-size:16px}.lv{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.lg{color:var(--dim);font-size:13px;margin-top:2px;display:flex;justify-content:space-between;gap:8px}
.bar{height:9px;background:#262c38;border-radius:9px;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:var(--b);border-radius:9px;transition:width .5s}
.leg.hit .bar i{background:var(--g)}.leg.hit .lv{color:var(--g)}.leg.dead .bar i{background:var(--r)}.leg.dead .lv{color:var(--r)}
.err{color:var(--y);font-size:13px;margin-bottom:10px}
.settled{margin-top:6px}.settled summary{color:var(--dim);font-size:15px;padding:10px 2px;cursor:pointer}.settled .card{opacity:.8}
.day{display:flex;justify-content:space-between;align-items:baseline;margin:18px 2px 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.day .dl{font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.03em}.day .dr{font-size:14px;color:var(--dim)}
.day .dr b{margin-left:8px;font-size:16px}.pos{color:var(--g)}.neg{color:var(--r)}
.past{margin-top:4px}.past>summary{list-style:none;cursor:pointer}.past>summary::-webkit-details-marker{display:none}
.past>summary .dl:before{content:"▸ ";color:var(--dim)}.past[open]>summary .dl:before{content:"▾ "}
.pill.Pregame{}.res{font-weight:700;margin-left:6px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:18px 2px 10px;font-size:17px;font-weight:700}
.sec .dr{font-size:14px;font-weight:400;color:var(--dim)}.sec .dr b{font-size:16px;margin-left:6px}
details.grp>summary{list-style:none;cursor:pointer}details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary .dl:before{content:"▸ ";color:var(--dim)}details.grp[open]>summary .dl:before{content:"▾ "}
details.top{background:#121620;border:1px solid var(--line);border-radius:14px;padding:0 10px;margin-bottom:10px}
details.top>summary{margin:12px 2px}details.sub{margin-left:4px}details.sub>summary{margin:10px 2px 8px}
.card.empty{color:var(--dim);text-align:center}.settledh{margin-top:26px}
.foot{color:var(--dim);font-size:12px;text-align:center;margin-top:10px}
</style></head>
<body><div class="wrap">
<h1 id="title">🎟️ Ticket Tracker</h1>
<div class="sum">
 <div class="box"><div class="k">In play</div><div class="v" id="inplay">–</div></div>
 <div class="box"><div class="k">Potential</div><div class="v" id="pot">–</div></div>
 <div class="box"><div class="k">Today</div><div class="v" id="cashed">–</div></div>
</div>
<div class="upd"><span id="upd">Loading…</span><button onclick="refresh()">Refresh</button></div>
<div id="err" class="err"></div>
<div id="list"></div>
<div class="foot">Bets load from tickets.json; live stats from ESPN, refreshed every 30s. Cash % is a rough estimate (simple pace model), not a guarantee.</div>
</div>
<script src="logic.js?v=6"></script>
<script>
const cache={};
let ticketDoc=null;
const $=id=>document.getElementById(id);
const money=n=>'$'+n.toFixed(2);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function gameLine(g){
  if(!g||!g.away||!g.away.abbr) return '';
  const sc=g.state==='pre'?'':` ${g.away.score??''}-${g.home.score??''} ${g.home.abbr}`;
  return g.state==='pre'?`${g.away.abbr} @ ${g.home.abbr} · ${g.detail.replace(/^.*? at /,'')}`:`${g.away.abbr}${sc} · ${g.detail}`;
}
function cardHtml(t){
    const pr=t.profit!=null?TT.signedMoney(t.profit):'';
    const probTxt=t.status==='Cashed'?`WIN ✅ <b class="pos">${pr}</b>`:t.status==='Lost'?`LOSS ❌ <b class="neg">${pr}</b>`:t.status==='Void'?'Void':`Cash chance <b>${Math.round(t.prob*100)}%</b> <span>(estimate)</span>`;
    const pill={Cashed:'WIN',Lost:'LOSS',Live:'LIVE',Pregame:'Upcoming',Void:'Void'}[t.status]||t.status;
    return `<div class="card ${t.status}"><div class="hd"><div><div class="tn">${esc(t.name)}</div>
      <div class="ts">${money(t.stake)}${t.bonus?' bonus':''} to pay ${money(t.pays)}${t.time?' · '+esc(t.time):''}</div></div>
      <span class="pill ${t.status}">${pill}</span></div>
      <div class="prob">${probTxt}</div>
      ${t.legs.map(l=>{
        const pct=Math.min(100,l.line?Math.max(0,l.cur)/l.line*100:0);
        const tag=l.status==='hit'?'✅ ':l.status==='dead'?'❌ ':l.status==='void'?'⚪ ':'';
        const any1=l.anytime&&l.line===1;
        const val=l.status==='void'?'Void':any1?(l.cur>=1?`${l.cur} ${esc(l.label)}`:`No ${esc(l.label)} yet`):`${l.cur} / ${l.line}+`;
        const right=l.isOut&&l.status!=='hit'?'Ruled out':(l.status==='live'||l.status==='pending')?`${Math.round(l.prob*100)}% est`:'';
        return `<div class="leg ${l.status}"><div class="lr"><span class="lp">${tag}${esc(l.p)}</span><span class="lv">${val}</span></div>
        <div class="lg"><span>${any1?esc(l.anyText):l.line+'+ '+esc(l.label)} · ${esc(gameLine(l.game))}</span><span>${right}</span></div>
        <div class="bar"><i style="width:${pct}%"></i></div></div>`;}).join('')}
    </div>`;
}
const openState={};
function netCls(n){return n>0?'pos':n<0?'neg':'';}
// Settled -> Wins / Losses dropdowns, each sub-grouped by day (newest first) with count + net
function settledGroup(kind,list){
  const label=kind==='won'?'✅ Wins':'❌ Losses';
  const net=list.reduce((a,t)=>a+(t.profit||0),0);
  const byDay={};
  for(const t of list){const k=TT.ticketDay(t)||'undated';(byDay[k]=byDay[k]||[]).push(t);}
  const today=TT.currentDayKey(Date.now());
  const days=Object.keys(byDay).sort().reverse().map(k=>{
    const ts=byDay[k], n=ts.reduce((a,t)=>a+(t.profit||0),0), id=kind+':'+k;
    const open=id in openState?openState[id]:k===today;
    return `<details class="grp sub" data-k="${id}"${open?' open':''}><summary class="day"><span class="dl">${esc(TT.dayLabel(k==='undated'?null:k,today))}</span><span class="dr">${ts.length} ${kind==='won'?'win':'loss'}${ts.length===1?'':kind==='won'?'s':'es'} <b class="${netCls(n)}">${TT.signedMoney(n)}</b></span></summary>${ts.map(cardHtml).join('')}</details>`;
  }).join('');
  const id='top:'+kind, open=id in openState?openState[id]:false;
  return `<details class="grp top" data-k="${id}"${open?' open':''}><summary class="sec"><span class="dl">${label} (${list.length})</span><span class="dr"><b class="${netCls(net)}">${TT.signedMoney(net)}</b></span></summary>${days||'<div class="card">None yet.</div>'}</details>`;
}
function render(res){
  const view=TT.currentView(res,Date.now());
  $('title').textContent='🎟️ '+view.title;document.title=view.title;
  const all=res.tickets;
  const live=all.filter(t=>t.status==='Live'), up=all.filter(t=>t.status==='Pregame');
  const won=all.filter(t=>t.status==='Cashed'), lost=all.filter(t=>t.status==='Lost'||t.status==='Void');
  const bySettle=(a,b)=>(Date.parse(b.settledAt||'')||0)-(Date.parse(a.settledAt||'')||0);
  won.sort(bySettle);lost.sort(bySettle);
  up.sort((a,b)=>(TT.ticketTimes(a).first||0)-(TT.ticketTimes(b).first||0));
  const ts=view.todaySec;
  $('cashed').textContent=(ts.won||ts.lost)?TT.signedMoney(ts.net):'$0';
  $('cashed').style.color=ts.net>0?'var(--g)':ts.net<0?'var(--r)':'';
  const open=live.concat(up);
  $('inplay').textContent=money(open.reduce((a,t)=>a+t.stake,0)).replace(/\.00$/,'');
  $('pot').textContent=money(open.reduce((a,t)=>a+t.pays,0));
  document.querySelectorAll('details.grp').forEach(d=>{openState[d.dataset.k]=d.open;});
  let h=`<div class="sec"><span class="dl">🔴 Live (${live.length})</span><span class="dr">Today ${ts.won}W-${ts.lost}L <b class="${netCls(ts.net)}">${TT.signedMoney(ts.net)}</b></span></div>`;
  h+=live.length?live.map(cardHtml).join(''):'<div class="card empty">No live bets right now.</div>';
  if(up.length){
    const id='top:up', o=id in openState?openState[id]:true;
    h+=`<details class="grp top" data-k="${id}"${o?' open':''}><summary class="sec"><span class="dl">⏳ Upcoming (${up.length})</span><span class="dr">${money(up.reduce((a,t)=>a+t.stake,0))} to pay ${money(up.reduce((a,t)=>a+t.pays,0))}</span></summary>${up.map(cardHtml).join('')}</details>`;
  }
  h+=`<div class="sec settledh"><span class="dl">Settled</span></div>`+settledGroup('won',won)+settledGroup('lost',lost);
  $('list').innerHTML=h;
}
async function loadTickets(){
  try{
    const r=await fetch(`tickets.json?t=${Date.now()}`,{cache:'no-store'});
    if(!r.ok) throw new Error(r.status);
    const d=await r.json();
    if(!d||!Array.isArray(d.tickets)) throw new Error('bad tickets.json');
    ticketDoc=d; try{localStorage.setItem('tt_tickets',JSON.stringify(d));}catch(e){}
    return true;
  }catch(e){
    if(!ticketDoc){try{ticketDoc=JSON.parse(localStorage.getItem('tt_tickets'));}catch(_){}}
    return false;
  }
}
async function refresh(){
  const tOk=await loadTickets();
  const tickets=TT.normalizeTickets(ticketDoc||{tickets:[]});
  const events=TT.eventsOf(tickets);
  let errs=0;
  await Promise.all(events.map(async e=>{
    const g=cache[e.key];
    if(g&&g.game.state==='post'&&g._final) return; // finished games don't change
    try{
      const r=await fetch(TT.summaryUrl(e.sport,e.ev),{cache:'no-store'});
      if(!r.ok) throw new Error(r.status);
      const p=TT.parseSummary(await r.json(),e.sport);
      if(p.game.state==='post'&&g&&g.game.state==='post') p._final=true;
      cache[e.key]=p;
    }catch(err){errs++;}
  }));
  render(TT.evaluate(tickets,cache));
  $('upd').textContent='Updated '+new Date().toLocaleTimeString('en-US',{timeZone:'America/New_York',hour:'numeric',minute:'2-digit',second:'2-digit'})+' ET';
  const msgs=[];
  if(errs) msgs.push(`Couldn't reach ESPN for ${errs} game(s); retrying in 30s.`);
  if(!tOk) msgs.push(ticketDoc?'Couldn\'t load the latest bets; showing saved ones.':'Couldn\'t load bets; retrying in 30s.');
  $('err').textContent=msgs.join(' ');
}
refresh();setInterval(refresh,30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh();});
</script></body></html>
