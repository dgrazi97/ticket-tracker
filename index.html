<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ticket Tracker</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ticket Tracker">
<meta name="theme-color" content="#0e1117">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#0e1117;--card:#171b24;--line:#262c38;--txt:#e6e9ef;--dim:#8b93a5;--g:#22c55e;--r:#ef4444;--y:#eab308;--b:#3b82f6}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",Segoe UI,Roboto,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 30px)}
h1{font-size:24px;margin:4px 0 12px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.box .k{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}.box .v{font-size:22px;font-weight:700;margin-top:2px}
.upd{display:flex;justify-content:space-between;align-items:center;color:var(--dim);font-size:13px;margin:8px 2px 14px}
button{background:#232a37;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.card.Cashed{border-color:var(--g)}.card.Lost{border-color:var(--r);opacity:.75}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.tn{font-size:19px;font-weight:700}.ts{color:var(--dim);font-size:14px;margin-top:2px}
.pill{font-size:13px;font-weight:700;padding:5px 10px;border-radius:999px;white-space:nowrap}
.pill.Pregame{background:#2a3140;color:#c3c9d6}.pill.Live{background:#3b2f0b;color:var(--y)}.pill.Cashed{background:#0f3a20;color:var(--g)}.pill.Lost{background:#3d1414;color:var(--r)}
.prob{margin:10px 0 4px;font-size:14px;color:var(--dim)}.prob b{color:var(--txt);font-size:17px}
.leg{border-top:1px solid var(--line);padding:11px 0 9px}
.lr{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.lp{font-weight:600;font-size:16px}.lv{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.lg{color:var(--dim);font-size:13px;margin-top:2px;display:flex;justify-content:space-between;gap:8px}
.bar{height:9px;background:#262c38;border-radius:9px;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:var(--b);border-radius:9px;transition:width .5s}
.leg.hit .bar i{background:var(--g)}.leg.hit .lv{color:var(--g)}.leg.dead .bar i{background:var(--r)}.leg.dead .lv{color:var(--r)}
.err{color:var(--y);font-size:13px;margin-bottom:10px}
.foot{color:var(--dim);font-size:12px;text-align:center;margin-top:10px}
</style></head>
<body><div class="wrap">
<h1>🏈 Ticket Tracker</h1>
<div class="sum">
 <div class="box"><div class="k">In play</div><div class="v" id="inplay">$30</div></div>
 <div class="box"><div class="k">Potential</div><div class="v" id="pot">$260.35</div></div>
 <div class="box"><div class="k">Cashed</div><div class="v" id="cashed" style="color:var(--g)">$0.00</div></div>
</div>
<div class="upd"><span id="upd">Loading…</span><button onclick="refresh()">Refresh</button></div>
<div id="err" class="err"></div>
<div id="list"></div>
<div class="foot">Live stats from ESPN, refreshed every 30s. Cash % is a rough estimate (simple pace model), not a guarantee.</div>
</div>
<script src="logic.js"></script>
<script>
const EVENTS=[...new Set(TT.TICKETS.flatMap(t=>t.legs.map(l=>l.ev)))];
const cache={};
const $=id=>document.getElementById(id);
const money=n=>'$'+n.toFixed(2);
function gameLine(g){
  if(!g||!g.away||!g.away.abbr) return '';
  const sc=g.state==='pre'?'':` ${g.away.score??''}-${g.home.score??''} ${g.home.abbr}`;
  return g.state==='pre'?`${g.away.abbr} @ ${g.home.abbr} · ${g.detail.replace(/^.*? at /,'')}`:`${g.away.abbr}${sc} · ${g.detail}`;
}
function render(res){
  $('cashed').textContent=money(res.cashed);
  $('list').innerHTML=res.tickets.map(t=>{
    const probTxt=t.status==='Cashed'?'Cashed ✅':t.status==='Lost'?'Lost ❌':`Cash chance <b>${Math.round(t.prob*100)}%</b> <span>(estimate)</span>`;
    return `<div class="card ${t.status}"><div class="hd"><div><div class="tn">${t.name}</div>
      <div class="ts">${money(t.stake)} to pay ${money(t.pays)} · ${t.time}</div></div>
      <span class="pill ${t.status}">${t.status}</span></div>
      <div class="prob">${probTxt}</div>
      ${t.legs.map(l=>{
        const pct=Math.min(100,l.line?l.cur/l.line*100:0);
        const tag=l.status==='hit'?'✅ ':l.status==='dead'?'❌ ':'';
        const val=l.stat==='td'?(l.cur>=1?`${l.cur} TD`:'No TD yet'):`${l.cur} / ${l.line}+`;
        const right=l.isOut&&l.status!=='hit'?'Ruled out':(l.status==='live'||l.status==='pending')?`${Math.round(l.prob*100)}% est`:'';
        return `<div class="leg ${l.status}"><div class="lr"><span class="lp">${tag}${l.p}</span><span class="lv">${val}</span></div>
        <div class="lg"><span>${l.stat==='td'?'Anytime TD':l.line+'+ '+l.label} · ${gameLine(l.game)}</span><span>${right}</span></div>
        <div class="bar"><i style="width:${pct}%"></i></div></div>`;}).join('')}
    </div>`;}).join('');
}
async function refresh(){
  let errs=0;
  await Promise.all(EVENTS.map(async ev=>{
    const g=cache[ev];
    if(g&&g.game.state==='post'&&g._final) return; // finished games don't change
    try{
      const r=await fetch(`https://site.api.espn.com/apis/site/v2/sports/football/nfl/summary?event=${ev}`,{cache:'no-store'});
      if(!r.ok) throw new Error(r.status);
      const p=TT.parseSummary(await r.json());
      if(p.game.state==='post'&&g&&g.game.state==='post') p._final=true;
      cache[ev]=p;
    }catch(e){errs++;}
  }));
  render(TT.evaluate(cache));
  $('upd').textContent='Updated '+new Date().toLocaleTimeString('en-US',{timeZone:'America/New_York',hour:'numeric',minute:'2-digit',second:'2-digit'})+' ET';
  $('err').textContent=errs?`Couldn't reach ESPN for ${errs} game(s); retrying in 30s.`:'';
}
refresh();setInterval(refresh,30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh();});
</script></body></html>
